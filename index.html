<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink - A Minimalist Aesthetic Experience</title>
    <meta name="description" content="A gorgeous, interactive minimalist pink canvas featuring glassmorphism, smooth animations, and premium typography.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+J:wght@100..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="canvas-container">
        <!-- Floating ambient glowing circles for a premium aesthetic -->
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>

        <div class="centered-content">
            <h1 id="boilerplate-title" class="centered-heading">Happy Birthday<br> Ale!!!!</h1>
            <img src="heather.png" alt="Princess Heart" class="aesthetic-image" id="heather-image">
        </div>

        <div class="bottom-container">
            <img src="maria1.png" alt="Maria Leaning" class="maria-image" id="maria1-image">
            <img src="maria2.png" alt="Maria Standing" class="maria-image" id="maria2-image">
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
